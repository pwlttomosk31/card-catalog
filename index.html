<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Card Catalog</title><style>
body{font-family:sans-serif;background:#0f0f1a;color:#eee;margin:0}
header{position:sticky;top:0;background:#0f0f1aee;padding:12px 16px;
border-bottom:1px solid #2a2a44;z-index:10}
h1{margin:0 0 8px;font-size:1.3em}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls input[type=search]{flex:1 1 160px;min-width:120px;padding:6px 10px;
border-radius:6px;border:1px solid #2a2a44;background:#1a1a2e;color:#eee}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{background:#1a1a2e;color:#ccc;border:1px solid #2a2a44;
border-radius:14px;padding:4px 10px;cursor:pointer;font-size:.85em}
.chips button.on{background:#ffd700;color:#111;border-color:#ffd700}
select{background:#1a1a2e;color:#eee;border:1px solid #2a2a44;
border-radius:6px;padding:5px}
label.toggle{font-size:.85em;color:#ccc;display:flex;gap:4px;align-items:center}
#count{font-size:.85em;color:#999;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:16px;padding:16px}
.card{background:#1a1a2e;border-radius:8px;padding:12px;position:relative;
display:block;color:#eee;text-decoration:none}
.card img{width:100%;border-radius:4px}
.card h3{font-size:.95em;margin:8px 0 4px}
.card .price{color:#ffd700;font-weight:bold;margin:0}
.badges{display:flex;gap:6px;margin-top:6px}
.badge{font-size:.7em;background:#2a2a44;border-radius:4px;padding:2px 6px;color:#bbb}
.sold{position:absolute;top:8px;left:8px;background:#c0392b;color:#fff;
padding:2px 10px;border-radius:4px;font-weight:bold}
</style></head><body>
<header><h1>Card Catalog</h1>
<div class="controls">
<input id="q" type="search" placeholder="Search cards..." aria-label="Search">
<div class="chips" id="cat-chips">
<button data-cat="ALL" class="on">All</button>
<button data-cat="ONE PIECE">One Piece</button>
<button data-cat="POKEMON">Pok&eacute;mon</button>
<button data-cat="YU-GI-OH">Yu-Gi-Oh!</button>
<button data-cat="Other">Other</button>
</div>
<div class="chips" id="grade-chips">
<button data-grade="" class="on">All grades</button>
<button data-grade="10">PSA 10</button>
<button data-grade="9">PSA 9</button>
<button data-grade="8-">PSA 8 &amp; below</button>
</div>
<select id="sort" aria-label="Sort">
<option value="newest">Newest</option>
<option value="price-desc">Price: high to low</option>
<option value="price-asc">Price: low to high</option>
</select>
<label class="toggle"><input type="checkbox" id="hide-sold">Hide sold</label>
<span id="count"></span>
</div></header>
<div class="grid" id="grid"><a class="card" data-id="ad_7fe08705" href="cards/ad_7fe08705.html"><img src="images/thumbs/ad_7fe08705.jpg?v=6eadb573" loading="lazy" alt="PSA 10 ONE PIECE BASE SHOP COLLECTION COMPLETE Sequential SET"><h3>PSA 10 ONE PIECE BASE SHOP COLLECTION COMPLETE Sequential SET</h3><p class="price">$400</p><div class="badges"><span class="badge">PSA 10</span><span class="badge">One Piece</span></div></a></div>
<script id="card-data" type="application/json">[{"id": "ad_7fe08705", "name": "PSA 10 ONE PIECE BASE SHOP COLLECTION COMPLETE Sequential SET", "price": 400.0, "sold": false, "grade": "10", "category": "ONE PIECE", "order": 2}]</script>
<script>"use strict";
/* Filtering and sorting for the public catalog listing.
   The pure functions (gradeBucket / cardMatches / compareCards) are read
   directly by node tests.
   The DOM-manipulation part only runs where `document` exists (a browser).
   This file is inlined into index.html by catalog.py (no external load). */

function gradeBucket(grade) {
  if (!grade) return "";
  var n = parseFloat(grade);
  if (n >= 10) return "10";
  if (n >= 9) return "9";          /* 9.5 goes in the PSA 9 chip (floor-like) */
  return "8-";
}

function cardMatches(card, f) {
  if (f.hideSold && card.sold) return false;
  if (f.category && f.category !== "ALL" && card.category !== f.category) return false;
  if (f.grade && gradeBucket(card.grade) !== f.grade) return false;
  if (f.query &&
      card.name.toUpperCase().indexOf(f.query.toUpperCase()) === -1) return false;
  return true;
}

function compareCards(a, b, sort) {
  if (a.sold !== b.sold) return a.sold ? 1 : -1;        /* SOLD always sinks to the bottom */
  if (sort === "price-desc" || sort === "price-asc") {
    if (a.price === null && b.price === null) return b.order - a.order;
    if (a.price === null) return 1;                     /* "Ask" price sinks to the bottom */
    if (b.price === null) return -1;
    if (a.price !== b.price)
      return sort === "price-desc" ? b.price - a.price : a.price - b.price;
  }
  return b.order - a.order;                             /* newest (default) */
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = { gradeBucket: gradeBucket, cardMatches: cardMatches,
                     compareCards: compareCards };
}

if (typeof document !== "undefined") {
  (function () {
    var data = JSON.parse(document.getElementById("card-data").textContent);
    var grid = document.getElementById("grid");
    var els = {};
    data.forEach(function (c) {
      els[c.id] = grid.querySelector('[data-id="' + c.id + '"]');
    });
    var state = { query: "", category: "ALL", grade: "", hideSold: false,
                  sort: "newest" };

    function apply() {
      var shown = data
        .filter(function (c) { return cardMatches(c, state); })
        .sort(function (a, b) { return compareCards(a, b, state.sort); });
      data.forEach(function (c) { els[c.id].style.display = "none"; });
      shown.forEach(function (c) {
        els[c.id].style.display = "";
        grid.appendChild(els[c.id]);      /* reorder into display order */
      });
      document.getElementById("count").textContent =
        shown.length + (shown.length === 1 ? " card" : " cards");
    }

    function wireChips(boxId, key, dataAttr) {
      var box = document.getElementById(boxId);
      box.addEventListener("click", function (e) {
        var b = e.target.closest("button");
        if (!b) return;
        box.querySelectorAll("button").forEach(function (x) {
          x.classList.remove("on");
        });
        b.classList.add("on");
        state[key] = b.getAttribute(dataAttr);
        apply();
      });
    }

    document.getElementById("q").addEventListener("input", function (e) {
      state.query = e.target.value;
      apply();
    });
    wireChips("cat-chips", "category", "data-cat");
    wireChips("grade-chips", "grade", "data-grade");
    document.getElementById("sort").addEventListener("change", function (e) {
      state.sort = e.target.value;
      apply();
    });
    document.getElementById("hide-sold").addEventListener("change", function (e) {
      state.hideSold = e.target.checked;
      apply();
    });
    apply();
  })();
}
</script>
</body></html>
